services:
  - type: web
    name: colegio-capellan-pascal
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_DRIVE_ROUTES_SUPABASE_URL
        sync: false
      - key: VITE_DRIVE_ROUTES_SUPABASE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
